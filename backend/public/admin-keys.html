<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑몰 관리 — SEER</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1f2937;
    --muted:#6b7280; --accent:#2563eb; --danger:#dc2626; --ok:#059669;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:32px 20px 64px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.6;
  }
  .wrap { max-width:880px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:20px; margin-bottom:20px;
  }
  .card h2 { font-size:15px; margin:0 0 14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 5px; }
  input[type=text], input[type=password] {
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; font-family:inherit;
  }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  .row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  button {
    padding:9px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  button:hover { filter:brightness(.94); }
  button.ghost { background:#fff; color:var(--text); border:1px solid var(--line); font-weight:500; }
  button.danger { background:#fff; color:var(--danger); border:1px solid var(--line); font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  td.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; background:#eef2ff; color:#4338ca; }
  .tag.env { background:#fef3c7; color:#92400e; }
  .tag.off { background:#f3f4f6; color:var(--muted); }
  .msg { padding:11px 14px; border-radius:6px; margin-bottom:16px; display:none; }
  .msg.err { background:#fef2f2; color:var(--danger); display:block; }
  .msg.ok  { background:#ecfdf5; color:var(--ok); display:block; }
  .issued {
    background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px;
    padding:16px; margin-top:16px; display:none;
  }
  .issued.show { display:block; }
  .issued .label { font-size:12px; color:var(--muted); margin-top:10px; }
  .copybox { display:flex; gap:8px; margin-top:4px; }
  .copybox input { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#fff; }
  .empty { color:var(--muted); text-align:center; padding:28px 0; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .brand { color:var(--accent); font-weight:800; letter-spacing:.04em; margin-bottom:4px; }
  .report-row td { background:#f8fafc; padding:14px 12px 18px; }
  .report-setting { display:grid; grid-template-columns:minmax(240px,1fr) auto auto; gap:10px; align-items:end; }
  .check { display:flex; align-items:center; gap:7px; padding:9px 0; white-space:nowrap; }
  .status-line { font-size:12px; color:var(--muted); margin-top:8px; }
  .status-line strong { color:var(--text); }
  @media (max-width:700px) { .report-setting { grid-template-columns:1fr; } table { display:block; overflow-x:auto; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">SEER ADMIN</div>
  <h1>쇼핑몰 관리</h1>
  <p class="sub">쇼핑몰 접근 키와 월요일 오전에 발송할 주간 리포트를 관리합니다.</p>

  <div class="msg" id="msg"></div>

  <!-- 관리자 인증 -->
  <div class="card" id="auth-card">
    <h2>관리자 키</h2>
    <div class="row">
      <div>
        <label for="admin-key">서버의 ADMIN_KEY</label>
        <input type="password" id="admin-key" placeholder="관리자 키를 입력하세요" autocomplete="off">
      </div>
      <button id="btn-auth">확인</button>
    </div>
    <p class="hint">이 브라우저에만 저장됩니다. 공용 PC에서는 사용 후 "잠그기"를 눌러주세요.</p>
  </div>

  <!-- 발급 -->
  <div class="card" id="issue-card" style="display:none">
    <h2>새 키 발급</h2>
    <div class="row">
      <div>
        <label for="origin">쇼핑몰 주소</label>
        <input type="text" id="origin" placeholder="hshh2020.cafe24.com">
      </div>
      <div>
        <label for="label">이름 (선택)</label>
        <input type="text" id="label" placeholder="Digno Lucir">
      </div>
      <button id="btn-issue">발급</button>
    </div>
    <p class="hint">https:// 는 없어도 됩니다. m. 으로 시작하는 모바일 주소는 자동으로 합쳐집니다.</p>

    <div class="issued" id="issued">
      <strong>발급 완료</strong>
      <div class="label">사장님께 보낼 주소</div>
      <div class="copybox">
        <input type="text" id="out-url" readonly>
        <button class="ghost" data-copy="out-url">복사</button>
      </div>
      <div class="label">키</div>
      <div class="copybox">
        <input type="text" id="out-key" readonly>
        <button class="ghost" data-copy="out-key">복사</button>
      </div>
    </div>
  </div>

  <div class="card" id="smtp-card" style="display:none">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2 style="margin:0">이메일 발송 연결</h2>
        <div class="status-line" id="smtp-status">서버 SMTP 설정을 확인하는 중입니다.</div>
      </div>
      <button class="ghost" id="btn-smtp-check">연결 확인</button>
    </div>
  </div>

  <!-- 목록 -->
  <div class="card" id="list-card" style="display:none">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h2 style="margin:0">발급된 키</h2>
      <div style="flex:0">
        <button class="ghost" id="btn-toggle-revoked">폐기된 키 보기</button>
        <button class="ghost" id="btn-lock">잠그기</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

</div>

<script>
(() => {
  const STORAGE = 'gt_admin_key';
  const $ = (id) => document.getElementById(id);
  let showRevoked = false;

  const msg = (text, kind = 'err') => {
    const el = $('msg');
    el.textContent = text;
    el.className = 'msg ' + kind;
    if (kind === 'ok') setTimeout(() => { el.className = 'msg'; }, 4000);
  };

  const adminKey = () => { try { return localStorage.getItem(STORAGE) || ''; } catch { return ''; } };

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'X-GT-Admin-Key': adminKey(), ...(options.headers || {}) },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  }

  function setLocked(locked) {
    $('auth-card').style.display  = locked ? '' : 'none';
    $('issue-card').style.display = locked ? 'none' : '';
    $('smtp-card').style.display  = locked ? 'none' : '';
    $('list-card').style.display  = locked ? 'none' : '';
  }

  // ── 인증 ──────────────────────────────────────────────
  async function unlock(key) {
    try { localStorage.setItem(STORAGE, key); } catch {}
    try {
      await api('/api/admin/keys');
      setLocked(false);
      $('msg').className = 'msg';
      load();
    } catch (err) {
      try { localStorage.removeItem(STORAGE); } catch {}
      msg(err.message);
      setLocked(true);
    }
  }

  $('btn-auth').addEventListener('click', () => {
    const k = $('admin-key').value.trim();
    if (!k) return msg('관리자 키를 입력하세요.');
    unlock(k);
  });
  $('admin-key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-auth').click(); });

  $('btn-lock').addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE); } catch {}
    $('admin-key').value = '';
    setLocked(true);
    msg('잠갔습니다.', 'ok');
  });

  // ── 발급 ──────────────────────────────────────────────
  $('btn-issue').addEventListener('click', async () => {
    const origin = $('origin').value.trim();
    if (!origin) return msg('쇼핑몰 주소를 입력하세요.');

    $('btn-issue').disabled = true;
    try {
      const r = await api('/api/admin/keys', {
        method: 'POST',
        body: JSON.stringify({ origin, label: $('label').value.trim() }),
      });

      $('out-url').value = location.origin + r.dashboard_url;
      $('out-key').value = r.key;
      $('issued').classList.add('show');
      $('origin').value = '';
      $('label').value  = '';

      msg(r.warning ? r.warning : `${r.origin} 키를 발급했습니다.`, r.warning ? 'err' : 'ok');
      load();
    } catch (err) {
      msg(err.message);
    } finally {
      $('btn-issue').disabled = false;
    }
  });

  document.addEventListener('click', (e) => {
    const id = e.target.getAttribute?.('data-copy');
    if (!id) return;
    const input = $(id);
    input.select();
    navigator.clipboard?.writeText(input.value)
      .then(() => msg('복사했습니다.', 'ok'))
      .catch(() => msg('복사에 실패했습니다. 직접 선택해 주세요.'));
  });

  // ── 목록 ──────────────────────────────────────────────
  $('btn-toggle-revoked').addEventListener('click', () => {
    showRevoked = !showRevoked;
    $('btn-toggle-revoked').textContent = showRevoked ? '유효한 키만 보기' : '폐기된 키 보기';
    load();
  });

  const fmt = (d) => d ? new Date(d).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

  async function load() {
    try {
      const r = await api('/api/admin/keys' + (showRevoked ? '?include_revoked=1' : ''));
      window.__smtpConfigured = r.smtp_configured;
      const smtp = $('smtp-status');
      smtp.textContent = r.smtp_configured
        ? 'SMTP 설정이 입력되어 있습니다. “연결 확인”으로 실제 서버 접속을 검사할 수 있습니다.'
        : `메일 발송 전 서버 설정이 필요합니다: ${(r.smtp_missing || []).join(', ')}`;

      if (!r.keys.length) {
        $('list').innerHTML = '<div class="empty">발급된 키가 없습니다.</div>';
        return;
      }

      $('list').innerHTML = `
        <table>
          <thead><tr>
            <th>쇼핑몰</th><th>이름</th><th>키</th><th>마지막 사용</th><th></th>
          </tr></thead>
          <tbody>${r.keys.map(rowHtml).join('')}</tbody>
        </table>`;
    } catch (err) {
      msg(err.message);
      if (/관리자/.test(err.message)) setLocked(true);
    }
  }

  function rowHtml(k) {
    const host = k.origin.replace(/^https?:\/\//, '');
    const tag = k.revoked
      ? '<span class="tag off">폐기됨</span>'
      : (k.source === 'env' ? '<span class="tag env">환경변수 이관</span>' : '');
    const action = k.revoked
      ? `<button class="ghost" data-restore="${k.id}">복구</button>`
      : `<button class="danger" data-revoke="${k.id}">폐기</button>`;

    const report = k.latest_report;
    const reportText = !report
      ? '생성 이력 없음'
      : `${report.week_start} ~ ${report.week_end} · 리포트 ${report.status} · 메일 ${report.email_status}`;
    const smtpText = window.__smtpConfigured === false
      ? ' · 서버 메일 설정 필요'
      : '';
    const recipients = (k.report_settings?.recipients || []).join(', ');

    return `<tr>
      <td>${host} ${tag}</td>
      <td>${k.label || '—'}</td>
      <td class="mono">${k.key}</td>
      <td>${fmt(k.last_used_at)}</td>
      <td style="text-align:right">${action}</td>
    </tr>
    <tr class="report-row">
      <td colspan="5">
        <div class="report-setting">
          <div>
            <label for="report-email-${k.id}">주간 리포트 수신 이메일 (쉼표로 여러 명 입력)</label>
            <input type="text" id="report-email-${k.id}" value="${recipients}" placeholder="owner@example.com">
          </div>
          <label class="check"><input type="checkbox" id="report-enabled-${k.id}" ${k.report_settings?.enabled ? 'checked' : ''}> 월요일 오전 9시 자동 발송</label>
          <div style="display:flex;gap:7px"><button class="ghost" data-save-report="${k.id}">설정 저장</button><button class="ghost" data-test-report="${k.id}">테스트 메일</button></div>
        </div>
        <div class="status-line"><strong>최근 상태</strong> · ${reportText}${smtpText}${report?.emailed_at ? ` · ${fmt(report.emailed_at)} 발송` : ''}</div>
      </td>
    </tr>`;
  }

  document.addEventListener('click', async (e) => {
    const revokeId  = e.target.getAttribute?.('data-revoke');
    const restoreId = e.target.getAttribute?.('data-restore');
    const saveReportId = e.target.getAttribute?.('data-save-report');
    const testReportId = e.target.getAttribute?.('data-test-report');

    if (revokeId) {
      if (!confirm('이 키를 폐기하면 해당 사장님은 대시보드에 들어갈 수 없습니다. 진행할까요?')) return;
      try { await api(`/api/admin/keys/${revokeId}`, { method: 'DELETE' }); msg('폐기했습니다.', 'ok'); load(); }
      catch (err) { msg(err.message); }
    }

    if (restoreId) {
      try { await api(`/api/admin/keys/${restoreId}/restore`, { method: 'POST' }); msg('복구했습니다.', 'ok'); load(); }
      catch (err) { msg(err.message); }
    }

    if (saveReportId) {
      const recipients = $(`report-email-${saveReportId}`).value.split(/[\s,;]+/).filter(Boolean);
      const enabled = $(`report-enabled-${saveReportId}`).checked;
      e.target.disabled = true;
      try {
        const result = await api(`/api/admin/keys/${saveReportId}/report-settings`, {
          method: 'PATCH',
          body: JSON.stringify({ recipients, enabled }),
        });
        msg(result.smtp_configured
          ? '주간 리포트 설정을 저장했습니다.'
          : '설정은 저장했습니다. 실제 발송을 위해 서버 SMTP 설정이 필요합니다.',
        result.smtp_configured ? 'ok' : 'err');
        load();
      } catch (err) { msg(err.message); }
      finally { e.target.disabled = false; }
    }

    if (testReportId) {
      if (!confirm('저장된 수신 이메일로 SEER 테스트 메일을 발송할까요?')) return;
      e.target.disabled = true;
      try {
        const result = await api(`/api/admin/keys/${testReportId}/report-settings/test`, { method: 'POST' });
        msg(`테스트 메일을 발송했습니다: ${(result.recipients || []).join(', ')}`, 'ok');
      } catch (err) { msg(err.message); }
      finally { e.target.disabled = false; }
    }
  });

  $('btn-smtp-check').addEventListener('click', async () => {
    const button = $('btn-smtp-check');
    button.disabled = true;
    $('smtp-status').textContent = 'SMTP 서버에 연결하는 중입니다.';
    try {
      const result = await api('/api/admin/keys/smtp/status');
      $('smtp-status').textContent = result.connected
        ? 'SMTP 서버 연결과 인증이 정상입니다.'
        : `메일 발송 전 서버 설정이 필요합니다: ${(result.missing || []).join(', ')}`;
      if (result.connected) msg('SMTP 연결을 확인했습니다.', 'ok');
    } catch (err) {
      $('smtp-status').textContent = `SMTP 연결 실패: ${err.message}`;
      msg(err.message);
    } finally { button.disabled = false; }
  });

  // ── 시작 ──────────────────────────────────────────────
  if (adminKey()) unlock(adminKey());
  else setLocked(true);
})();
</script>
</body>
</html>
