<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운영 화면 열기 | GhostTracker</title><link rel="stylesheet" href="/app.css"></head><body data-page="login"><header class="topbar"><a class="brand" href="/"><span class="logo">GT</span><span><strong>GhostTracker</strong><small>쇼핑몰 운영 도우미</small></span></a><a class="btn secondary" href="/guide.html">사용 방법</a></header><main class="public-main"><section class="card form-card"><div style="text-align:center;margin-bottom:28px"><span class="logo" style="margin:auto">GT</span><h1 class="point" style="font-size:1.7rem;margin:18px 0 8px">쇼핑몰 운영 화면 열기</h1><p class="lead" style="font-size:.95rem;margin:0">담당자에게 받은 사이트 접근 키를 입력하세요.</p></div><div class="notice warn" id="login-reason" style="display:none;margin-bottom:18px"></div><form id="key-form"><div class="field"><label for="site-key">사이트 접근 키</label><input id="site-key" autocomplete="off" placeholder="접근 키를 입력해주세요" required></div><button style="width:100%" type="submit">운영 화면 열기</button></form><div class="notice" style="margin-top:18px">처음 사용하시나요? 먼저 <a href="/demo-onboarding.html"><strong>쇼핑몰 연결하기</strong></a>에서 설치 과정을 확인해주세요.</div><p style="text-align:center;margin:20px 0 0;font-size:.85rem"><a href="/admin-keys.html" style="color:#6b7280">운영자용 · 접근 키 관리</a></p></section></main><script>
/* 대시보드가 키 문제로 돌려보냈으면 이유를 알려준다.
   이 안내가 없으면 사장님 입장에서는 "눌렀는데 로그인 화면으로 돌아왔다"로만 보인다. */
(function(){
  var REASONS = {
    missing: '접근 키가 필요합니다. 담당자에게 받은 키를 입력해주세요.',
    invalid: '접근 키가 만료되었거나 폐기되었습니다. 담당자에게 새 키를 요청해주세요.'
  };
  var reason = new URLSearchParams(location.search).get('reason');
  var box = document.getElementById('login-reason');
  if (reason && REASONS[reason] && box) {
    box.textContent = REASONS[reason];
    box.style.display = 'block';
  }
})();

document.getElementById('key-form').addEventListener('submit',function(e){e.preventDefault();const key=document.getElementById('site-key').value.trim();if(key)location.href='/operator-dashboard.html?key='+encodeURIComponent(key)})</script><script src="/app.js"></script></body></html>
